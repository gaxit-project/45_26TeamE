<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Meiryo, 'Hiragino Sans', sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
