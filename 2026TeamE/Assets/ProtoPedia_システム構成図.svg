  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f3a5f">システム構成</text>

  <!-- ===== 入力層 ===== -->
  <rect x="40" y="56" width="920" height="72" rx="8" fill="#f5f7fa" stroke="#c7d2e0" stroke-width="1.5"/>
