  <path d="M208,215 L234,215" stroke="#1976d2" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M388,215 L414,215" stroke="#1976d2" stroke-width="1.6" marker-end="url(#arrow)"/>
