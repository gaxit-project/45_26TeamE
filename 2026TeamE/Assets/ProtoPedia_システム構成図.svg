  <rect x="196" y="636" width="220" height="34" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="1.2"/>
  <text x="306" y="658" text-anchor="middle" font-size="13" fill="#212121">URP（描画）</text>

  <rect x="440" y="636" width="220" height="34" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="1.2"/>
  <text x="550" y="658" text-anchor="middle" font-size="13" fill="#212121">CRI ADX（音声）</text>

  <rect x="684" y="636" width="220" height="34" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="1.2"/>
