  <rect x="40" y="458" width="920" height="130" rx="8" fill="#f5f7fa" stroke="#c7d2e0" stroke-width="1.5"/>
  <text x="60" y="482" font-size="14" font-weight="bold" fill="#1f3a5f">ゲームコア</text>

  <rect x="58" y="494" width="278" height="80" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.4"/>
  <text x="197" y="522" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">ボクセル地形</text>
  <text x="197" y="546" text-anchor="middle" font-size="12" fill="#212121">VoxelTerrain</text>
  <text x="197" y="564" text-anchor="middle" font-size="12" fill="#212121">Chunk</text>

  <rect x="360" y="494" width="278" height="80" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.4"/>
  <text x="499" y="522" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">プレイヤー・探索</text>
  <text x="499" y="546" text-anchor="middle" font-size="12" fill="#212121">PlayerController</text>
  <text x="499" y="564" text-anchor="middle" font-size="12" fill="#212121">Sonar ／ GemRadar</text>

  <rect x="662" y="494" width="278" height="80" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.4"/>
  <text x="801" y="522" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b5e20">埋没オブジェクト</text>
  <text x="801" y="546" text-anchor="middle" font-size="12" fill="#212121">BuriedItemBase</text>
  <text x="801" y="564" text-anchor="middle" font-size="12" fill="#212121">宝箱／宝石／爆弾</text>

  <path d="M500,588 L500,616" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 出力層 ===== -->
  <rect x="40" y="620" width="920" height="62" rx="8" fill="#f5f7fa" stroke="#c7d2e0" stroke-width="1.5"/>
